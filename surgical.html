<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surgical Information</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Surgical Information</h1>

<div class="card">

<label>Surgical Type</label>

<select id="surgicalType">

<option value="">Select ...</option>

<option value="general">General Surgery</option>
<option value="orthopedic">Orthopedic Surgery</option>
<option value="neurosurgery">Neurosurgery</option>
<option value="cardiac">Cardiac Surgery</option>
<option value="thoracic">Thoracic Surgery</option>
<option value="vascular">Vascular Surgery</option>
<option value="urologic">Urologic Surgery</option>
<option value="gynecologic">Gynecologic Surgery</option>
<option value="obstetric">Obstetric Surgery</option>
<option value="ent">ENT Surgery</option>
<option value="ophthalmic">Ophthalmic Surgery</option>
<option value="plastic">Plastic Surgery</option>
<option value="pediatric">Pediatric Surgery</option>
<option value="transplant">Transplant Surgery</option>
<option value="other">Other</option>

</select>


<label>
Surgical Grade

<span
class="help"
onclick="showGradeInfo()"
>?</span>

</label>

<select id="grade">

<option value="">Select ...</option>

<option value="minimal">Minimal</option>

<option value="mild">Mild</option>

<option value="grade2">Grade 2</option>

<option value="grade3">Grade 3</option>

</select>


<label>Expected Blood Loss</label>

<select id="bloodLoss">

<option value="">Select ...</option>

<option value="low">Low (&lt;500 mL)</option>

<option value="moderate">
Moderate (500–1000 mL)
</option>

<option value="high">
High (&gt;1000 mL)
</option>

</select>


<label>Surgical Urgency</label>

<select id="urgency">

<option value="">Select ...</option>

<option value="elective">Elective</option>

<option value="urgent">Urgent</option>

<option value="emergency">Emergency</option>

</select>


<div class="button-group">

<button
type="button"
onclick="history.back()"
>
← Back
</button>

<button
type="button"
id="nextBtn"
>
Next →
</button>

</div>

</div>

</div>

<script src="surgical.js"></script>

</body>

</html>
