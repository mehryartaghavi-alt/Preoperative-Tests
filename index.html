<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Preoperative Tests Advisor</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Preoperative Tests Advisor</h1>
<p class="subtitle">Patient Information</p>

<form id="patientForm">

<div class="card">

<label>Age* (years)</label>
<input type="number" id="age" min="0" max="120" >

<label>Sex*</label>
<div class="radio-group">
<label><input type="radio" name="sex" value="Male"> Male</label>
<label><input type="radio" name="sex" value="Female"> Female</label>
</div>

<label>Weight* (kg)</label>
<input type="number" id="weight" >

<label>Height* (cm)</label>
<input type="number" id="height" >

<label>ASA Physical Status*</label>

<select id="asa">

<option value="">Select ASA</option>

<option>ASA I</option>
<option>ASA II</option>
<option>ASA III</option>
<option>ASA IV</option>
<option>ASA V</option>
<option>ASA VI</option>

</select>

<label>Comorbidities*</label>

<div class="multi-select">

    <div class="select-btn" onclick="toggleDropdown()">
        <span id="selectedText">Select Comorbidities</span>
        <span>▼</span>
    </div>

    <div class="dropdown" id="dropdown">

        <label><input type="checkbox" value="Diabetes Mellitus"> Diabetes Mellitus</label>

        <label><input type="checkbox" value="Hypertension"> Hypertension</label>

        <label><input type="checkbox" value="Ischemic Heart Disease"> Ischemic Heart Disease</label>

        <label><input type="checkbox" value="Heart Failure"> Heart Failure</label>

        <label><input type="checkbox" value="Chronic Kidney Disease"> Chronic Kidney Disease</label>

        <label><input type="checkbox" value="Liver Disease"> Liver Disease</label>

        <label><input type="checkbox" value="COPD"> COPD</label>

        <label><input type="checkbox" value="Asthma"> Asthma</label>

        <label><input type="checkbox" value="Thyroid Disease"> Thyroid Disease</label>

        <label><input type="checkbox" value="Anticoagulant / Antiplatelet Therapy"> Anticoagulant / Antiplatelet Therapy</label>

        <label><input type="checkbox" value="Chemotherapy"> Chemotherapy</label>

        <label><input type="checkbox" value="Active Malignancy"> Active Malignancy</label>

        <label><input type="checkbox" value="Pregnancy"> Pregnancy</label>

        <label><input type="checkbox" value="Smoking"> Smoking</label>

        <label><input type="checkbox" value="Obstructive Sleep Apnea"> Obstructive Sleep Apnea</label>

    </div>

</div>

<button type="button" id="nextBtn">
Next →
</button>

</div>

</form>

</div>

<script src="script.js"></script>

</body>
</html>
