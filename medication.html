<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Medication Information</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>Medication Information</h1>


<!-- ============================= -->
<!-- Antidiabetic Medications -->
<!-- ============================= -->

<h2>Antidiabetic Medications</h2>

<div class="comorbidities-grid">

    <label class="condition-box">
        <input type="checkbox" id="metformin">
        <span>Metformin</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="sglt2">
        <span>SGLT2 Inhibitors</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="sulfonylurea">
        <span>Sulfonylureas</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="dpp4">
        <span>DPP-4 Inhibitors</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="glp1">
        <span>GLP-1 Agonists</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="insulin">
        <span>Insulin</span>
    </label>

</div>


<!-- ============================= -->
<!-- Anticoagulants -->
<!-- ============================= -->

<h2>Anticoagulants</h2>

<div class="comorbidities-grid">

    <label class="condition-box">
        <input type="checkbox" id="warfarin">
        <span>Warfarin</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="apixaban">
        <span>Apixaban</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="rivaroxaban">
        <span>Rivaroxaban</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="edoxaban">
        <span>Edoxaban</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="dabigatran">
        <span>Dabigatran</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="heparin">
        <span>Heparin</span>
    </label>

</div>


<!-- ============================= -->
<!-- Antiplatelet Agents -->
<!-- ============================= -->

<h2>Antiplatelet Agents</h2>

<div class="comorbidities-grid">

    <label class="condition-box">
        <input type="checkbox" id="aspirin">
        <span>Aspirin</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="clopidogrel">
        <span>Clopidogrel</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="prasugrel">
        <span>Prasugrel</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="ticagrelor">
        <span>Ticagrelor</span>
    </label>

</div>


<!-- ============================= -->
<!-- Cardiovascular Medications -->
<!-- ============================= -->

<h2>Cardiovascular Medications</h2>

<div class="comorbidities-grid">

    <label class="condition-box">
        <input type="checkbox" id="acei">
        <span>ACE Inhibitors</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="arb">
        <span>ARBs</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="betaBlocker">
        <span>Beta-Blockers</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="ccb">
        <span>CCBs</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="diuretic">
        <span>Diuretics</span>
    </label>

</div>


<!-- ============================= -->
<!-- Other Medications -->
<!-- ============================= -->

<h2>Other Medications</h2>

<div class="comorbidities-grid">

    <label class="condition-box">
        <input type="checkbox" id="steroid">
        <span>Corticosteroids</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="thyroidMedication">
        <span>Thyroid Medication</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="antiepileptic">
        <span>Antiepileptic Drugs</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="parkinsonMedication">
        <span>Parkinson's Medication</span>
    </label>

    <label class="condition-box">
        <input type="checkbox" id="herbal">
        <span>Herbal Use</span>
    </label>

</div>


<!-- ============================= -->
<!-- Navigation -->
<!-- ============================= -->

<div class="button-group">

    <button type="button" onclick="history.back()">
        ← Back
    </button>

    <button type="button" id="nextBtn">
        Next →
    </button>

</div>

</div>

<script src="medication.js"></script>

</body>
</html>
