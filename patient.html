<!DOCTYPE html>
<html lang="en">
<head> 
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<title>Patient Information</title>

<link rel="stylesheet" href="style.css">

<style>
.patient-card {
    max-width: 300px;
    margin: auto;
}

.patient-card label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
}

.patient-card input,
.patient-card select {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    box-sizing: border-box;
}

.sex-group {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    margin-top: 8px;
}

.sex-group label {
    margin-top: 0;
    font-weight: normal;
}

.bmi-display {
    background: #f2f5f8;
    font-weight: bold;
}

.navigation {
    display: flex;
    justify-content: space-between;
    margin-top: 30px;
    gap: 15px;
}

.navigation button {
    flex: 1;
}
</style>
</head>

<body>

<div class="container">

    <h1>Patient Information</h1>

    <div class="card patient-card">

        <label for="age">
            Age* (years)
        </label>
        <input
            type="number"
            id="age"
            min="0"
            max="120"
        >

        <label>
            Sex*
        </label>

        <div class="sex-group">
            <label>
                <input type="radio" name="sex" value="Male">
                Male
            </label>

            <label>
                <input type="radio" name="sex" value="Female">
                Female
            </label>
        </div>

        <label for="height">
            Height* (cm)
        </label>
        <input
            type="number"
            id="height"
            min="30"
            max="250"
            step="0.1"
        >

        <label for="weight">
            Weight* (kg)
        </label>
        <input
            type="number"
            id="weight"
            min="1"
            max="300"
            step="0.1"
        >

        <label for="bmi">
            BMI
        </label>
        <input
            type="text"
            id="bmi"
            class="bmi-display"
            readonly
            placeholder="Automatically calculated"
        >

        <label for="asa">
            ASA Physical Status*
        </label>

        <select id="asa">
            <option value="">Select...</option>
            <option value="1">ASA I</option>
            <option value="2">ASA II</option>
            <option value="3">ASA III</option>
            <option value="4">ASA IV</option>
            <option value="5">ASA V</option>
            <option value="6">ASA VI</option>
        </select>

        <label for="mets">
            Functional Capacity / METs
            <span
                class="help"
                onclick="showMetsInfo()"
            >?</span>
        </label>

        <select id="mets">
            <option value="">Select...</option>
            <option value="excellent">
                ≥10 METs (Excellent)
            </option>
            <option value="good">
                4–10 METs (Moderate–Good)
            </option>
            <option value="poor">
                &lt;4 METs (Poor)
            </option>
            <option value="unknown">
                Unknown
            </option>
        </select>

      <div class="navigation">

            <button
                type="button"
                onclick="goBack()"
            >
                ← Back
            </button>

            <button
                type="button"
                onclick="goNext()"
            >
                NEXT →
            </button>

        </div>

    </div>

</div>

<script src="patient.js"></script>

</body>
</html>
