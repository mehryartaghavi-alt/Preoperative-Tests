<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comorbidities</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Preoperative Tests Advisor</h1>

<h2 class="subtitle">Comorbidities</h2>

<div class="card">

<p class="reminder">
Select all relevant comorbidities and medical conditions.
</p>


<label class="check-row">
<input type="checkbox" id="hypertension">
Hypertension
</label>


<label class="check-row">
<input type="checkbox" id="diabetes">
Diabetes Mellitus
</label>


<label class="check-row">
<input type="checkbox" id="cad">
Coronary Artery Disease
</label>


<label class="check-row">
<input type="checkbox" id="heartFailure">
Heart Failure
</label>


<label class="check-row">
<input type="checkbox" id="arrhythmia">
Arrhythmia
</label>


<label class="check-row">
<input type="checkbox" id="valvular">
Valvular Heart Disease
</label>


<label class="check-row">
<input type="checkbox" id="ckd">
Chronic Kidney Disease
</label>


<label class="check-row">
<input type="checkbox" id="liver">
Chronic Liver Disease / Cirrhosis
</label>


<label class="check-row">
<input type="checkbox" id="respiratory">
Respiratory Disease
</label>


<label class="check-row">
<input type="checkbox" id="smoking">
Smoking
</label>


<label class="check-row">
<input type="checkbox" id="cva">
Cerebrovascular Disease / CVA
</label>


<label class="check-row">
<input type="checkbox" id="thyroid">
Thyroid Disease
</label>


<label class="check-row">
<input type="checkbox" id="bleeding">
Bleeding / Coagulation Disorder
</label>


<label class="check-row">
<input type="checkbox" id="anemia">
Anemia
</label>


<div class="button-group">

<button
type="button"
onclick="history.back()">
← Back
</button>

<button
type="button"
onclick="goNext()">
Next →
</button>

</div>

</div>

</div>

<script src="comorbidities.js"></script>

</body>

</html>
